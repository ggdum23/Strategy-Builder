name: gui

on:
  push:
  pull_request:

jobs:
  test:
    name: gui ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt libraries
        if: runner.os == 'Linux'
        run: python .github/install_qt_libraries.py
      - name: Install
        run: python -m pip install -e ".[dev,gui]"
      - name: Test
        run: python -m pytest -q tests/gui
