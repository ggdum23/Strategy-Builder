name: gui

on:
  push:
  pull_request:

jobs:
  test:
    name: gui ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt libraries
        if: runner.os == 'Linux'
        run: |
          set -eu
          packages="libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libfontconfig1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxrender1 libxi6 libsm6 libice6 fonts-dejavu-core"
          ok=0
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get update && sudo timeout 180 apt-get install -y --no-install-recommends $packages; then
              ok=1
              break
            fi
            echo "apt attempt ${attempt} failed"
            sleep 15
          done
          test "$ok" = 1
          sudo timeout 180 apt-get install -y --no-install-recommends tesseract-ocr || echo "tesseract unavailable; the OCR check will skip"
      - name: Install
        run: python -m pip install -e ".[dev,gui]"
      - name: Test
        run: python -m pytest -q tests/gui
