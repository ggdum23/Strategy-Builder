name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ubuntu / py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m backtester test

  windows-plan:
    name: windows plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - id: plan
        name: List shards
        run: python tests/ci_shards.py plan >> "$GITHUB_OUTPUT"

  windows:
    name: windows py${{ matrix.python }} / ${{ matrix.shard }}
    needs: windows-plan
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        shard: ${{ fromJson(needs.windows-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python tests/ci_shards.py run ${{ matrix.shard }}

  jailed-examples:
    name: jailed examples / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 360 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Jail the D examples
        if: runner.os != 'Windows'
        run: python -m pytest -q -m jailed_sample tests/test_jailed_examples.py
      - name: Jail the D examples
        if: runner.os == 'Windows'
        run: python -m pytest -q -m jailed_sample --timeout=60 --timeout-method=thread tests/test_jailed_examples.py
