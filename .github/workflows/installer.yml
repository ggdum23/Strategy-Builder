name: installer

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: build-install-smoke-uninstall
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      STRATEGY_BUILDER_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Install application and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install -r packaging/requirements-build.txt
      - name: Build installer
        shell: pwsh
        run: python packaging/build_windows.py
      - name: Record SHA256
        shell: pwsh
        run: python packaging/record_setup.py
      - name: Silent install
        shell: pwsh
        env:
          SB_INSTALL_DIR: ${{ runner.temp }}\Strategy Builder
        run: python packaging/ci_install.py
      - name: Smoke tests
        shell: pwsh
        env:
          SB_INSTALL_DIR: ${{ runner.temp }}\Strategy Builder
          SB_SMOKE_DIR: ${{ runner.temp }}\smoke results
        run: python packaging/smoke_frozen.py --repo .
      - name: Upgrade over existing install
        shell: pwsh
        env:
          SB_INSTALL_DIR: ${{ runner.temp }}\Strategy Builder
        run: python packaging/ci_upgrade.py
      - name: Silent uninstall
        if: always()
        shell: pwsh
        env:
          SB_INSTALL_DIR: ${{ runner.temp }}\Strategy Builder
        run: python packaging/ci_uninstall.py
      - name: Delete user data
        shell: pwsh
        env:
          SB_INSTALL_DIR: ${{ runner.temp }}\Strategy Builder
        run: python packaging/ci_delete_userdata.py
      - name: Upload setup.exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-builder-setup
          if-no-files-found: warn
          path: |
            packaging/dist/StrategyBuilder-Setup-*.exe
            packaging/dist/SHA256SUMS

  release:
    name: attach-to-release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: strategy-builder-setup
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
