[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-builder"
version = "0.1.0"
description = "Local 1-minute strategy backtester (Arena and Desk profiles)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-timeout>=2.2"]

[project.scripts]
backtester = "backtester.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "jailed_sample: full October sample, jailed file strategy versus in-process",
    "windows_jails(count): Windows pytest-timeout budget of 90 seconds per AppContainer jail",
]
